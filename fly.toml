# Configuração do Fly.io — uma escola por app.
# Troque o nome do app (precisa ser único no Fly) antes do primeiro "fly launch".
app = "biblioteca-armando-correa"
primary_region = "gru"          # São Paulo: os dados ficam no Brasil

[build]

[env]
  TZ = "America/Belem"           # datas e horário dos lembretes no fuso do Pará
  DATA_DIR = "/data"             # banco e cópias de segurança no volume persistente
  PORT = "8080"
  ATRAS_DE_PROXY = "1"
  ENTRADA_COM_NOMES = "0"        # na internet, a entrada pede usuário e senha

[[mounts]]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sempre ligado: o agendador precisa estar rodando para enviar os lembretes no horário.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/saude"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
